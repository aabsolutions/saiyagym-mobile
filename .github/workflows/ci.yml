name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  checks:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated code (freezed, riverpod, drift, json) is committed: it
      # must match the sources.
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' '*.steps.dart'

      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - name: Translations (es.json ↔ en.json, keys used in lib/)
        run: dart run tool/check_i18n.dart
      - run: flutter test --timeout 60s

  android:
    name: Android release (APK + AAB)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release configuration
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          # A release tag must match pubspec.yaml. API_BASE_URL is optional:
          # the prod flavor has the Render URL built in.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME != pubspec version $version"; exit 1; }
          fi

      # Secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A release needs the ANDROID_KEYSTORE_* secrets"; exit 1
            fi
            echo "::warning::No keystore secret: release signed with the debug key (do not upload)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          args=(--release --flavor prod --build-number "${{ github.run_number }}"
                --obfuscate --split-debug-info=build/symbols)
          if [[ -n "$API_BASE_URL" ]]; then
            args+=(--dart-define=API_BASE_URL="$API_BASE_URL")
          fi
          flutter build apk "${args[@]}"
          flutter build appbundle "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-prod-release.apk
            build/app/outputs/bundle/prodRelease/app-prod-release.aab
            build/symbols/
          retention-days: 14

  ios:
    name: iOS compiles (no signing)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed IPAs need the Apple team, certificates and profiles (see the
      # README); this only proves the iOS side builds.
      - run: >
          flutter build ios --release --no-codesign
          --dart-define=FLAVOR=prod
          --build-number ${{ github.run_number }}
