name: saiyagym_mobile
description: "GymApp mobile: live session logging, offline-first"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  clock: ^1.1.3
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  easy_localization: ^3.0.8
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.1
  workmanager: ^0.10.10

dev_dependencies:
  # 2.17.x is blocked by a transitive constraint of the generators.
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  image: ^4.12.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  # Only to mock easy_localization's locale persistence in tests.
  shared_preferences: ^2.5.6
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/

  fonts:
    # Variable font (wght 100–900), SIL OFL 1.1 — see assets/fonts/Outfit/OFL.txt.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Variable.ttf

# App icon: `dart run flutter_launcher_icons` (source PNGs drawn by
# tool/generate_branding.dart; replace them with a designed logo any time).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#00C9B7"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

# Launch screen: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#00C9B7"
  image: assets/branding/splash.png
  android_12:
    color: "#00C9B7"
    image: assets/branding/icon_foreground.png
    icon_background_color: "#00C9B7"
  fullscreen: false
